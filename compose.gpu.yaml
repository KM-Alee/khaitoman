# Optional: `docker compose -f compose.yaml -f compose.gpu.yaml --profile vision ...`
# Needs a working NVIDIA driver and nvidia-container-toolkit on the host.
services:
  vision:
    build:
      args: { TORCH_INDEX: "https://download.pytorch.org/whl/cu128" }
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
