# Opt-in GPU execution: make train-surrogate GPU=1. Docker must support --gpus all.
# The locked LightGBM Linux wheel supports OpenCL GPU training; no host project deps.
services:
  vision:
    build:
      args: { TORCH_INDEX: "https://download.pytorch.org/whl/cu128" }
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  api:
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      AABFLOW_SURROGATE_DEVICE: gpu
